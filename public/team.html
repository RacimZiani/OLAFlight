<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ola Flight — Équipe</title>
<meta name="ola-required-roles" content="admin">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@200;300&family=Montserrat:wght@200;300&display=swap');
:root{--b:#0a0a0a;--b2:#111;--w:#f5f3ef;--g:rgba(245,243,239,0.4);--l:rgba(245,243,239,0.1);--green:#4ade80;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--b);color:var(--w);font-family:'Cormorant Garamond',serif;}
.topbar{height:56px;background:var(--b2);border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 24px;gap:16px;}
.tb-name{font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;}
.tb-app-nav{display:flex;flex:1;}
.tb-nav{display:flex;}
.tb-tab{font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--g);padding:0 16px;height:56px;display:flex;align-items:center;text-decoration:none;border-bottom:2px solid transparent;}
.tb-tab.active,.tb-tab:hover{color:var(--w);border-bottom-color:var(--w);}
.wrap{padding:40px 32px;}
h1{font-size:32px;font-weight:200;margin-bottom:8px;}
.sub{font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:32px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.panel{border:1px solid var(--l);background:var(--b2);padding:24px;}
.ptitle{font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:16px;}
table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--l);font-family:'Montserrat',sans-serif;font-size:9px;}
th{color:var(--g);font-weight:300;letter-spacing:2px;text-transform:uppercase;}
.val{color:var(--green);}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-name">Ola Flight</div>
  <nav class="tb-app-nav"></nav>
</header>
<main class="wrap">
  <h1>Vue équipe</h1>
  <p class="sub">Closers & prospecteurs — pipeline et deals gagnés</p>
  <div class="grid" id="grid">Chargement…</div>
</main>
<script src="/auth-gate.js"></script>
<script src="/app-nav.js"></script>
<script>
async function load(){
  const r = await fetch('/api/team/overview', { credentials:'include' });
  const d = await r.json();
  const row = (m) => `<tr>
    <td>${m.name}<br><span style="opacity:.5">${m.email}</span></td>
    <td>${m.open}</td><td>${m.nego}</td><td>${m.won}</td>
    <td class="val">${Math.round(m.won_value).toLocaleString('fr-FR')} €</td>
  </tr>`;
  document.getElementById('grid').innerHTML = `
    <section class="panel">
      <div class="ptitle">Closers</div>
      <table><thead><tr><th>Nom</th><th>Ouverts</th><th>Négo</th><th>Gagnés</th><th>CA gagné</th></tr></thead>
      <tbody>${(d.closers||[]).map(row).join('')||'<tr><td colspan="5">Aucun closer</td></tr>'}</tbody></table>
    </section>
    <section class="panel">
      <div class="ptitle">Prospecteurs</div>
      <table><thead><tr><th>Nom</th><th>Ouverts</th><th>Négo</th><th>Gagnés</th><th>CA gagné</th></tr></thead>
      <tbody>${(d.prospecteurs||[]).map(row).join('')||'<tr><td colspan="5">Aucun prospecteur</td></tr>'}</tbody></table>
    </section>`;
}
document.addEventListener('ola:auth', load);
</script>
</body>
</html>
