<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ola Flight — Pipeline Commercial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300&family=Montserrat:wght@200;300;400&display=swap');
:root{
  --b:#0a0a0a;--b2:#111;--b3:#161616;--b4:#1a1a1a;
  --w:#f5f3ef;--g:rgba(245,243,239,0.38);--g2:rgba(245,243,239,0.2);
  --l:rgba(245,243,239,0.09);--l2:rgba(245,243,239,0.15);
  --green:rgba(74,222,128,0.12);--green-t:#4ade80;
  --yellow:rgba(250,204,21,0.12);--yellow-t:#facc15;
  --orange:rgba(251,146,60,0.12);--orange-t:#fb923c;
  --blue:rgba(96,165,250,0.12);--blue-t:#60a5fa;
  --red:rgba(248,113,113,0.12);--red-t:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--b);color:var(--w);font-family:'Cormorant Garamond',serif;font-weight:300;overflow-x:hidden;}

/* ─── TOP BAR ─── */
.topbar{height:56px;background:var(--b2);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:100;}
.tb-brand{display:flex;align-items:center;gap:12px;}
.tb-logo{width:24px;height:24px;background:var(--l2);border:1px solid var(--l2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--w);}
.tb-name{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:var(--w);}
.tb-app-nav{display:flex;gap:0;flex:1;}
.tb-nav{display:flex;gap:0;}
.tb-nav-inner{margin-left:0;}
.tb-tab{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);padding:0 24px;height:56px;display:flex;align-items:center;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.tb-tab:hover{color:var(--w);}
.tb-tab.active{color:var(--w);border-bottom-color:var(--w);}
.tb-right{display:flex;align-items:center;gap:16px;}
.tb-user{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);background:none;border:none;cursor:pointer;padding:4px 8px;transition:color .2s;}
.tb-user:hover{color:var(--w);}
.pw-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:400;display:none;align-items:center;justify-content:center;}
.pw-modal-bg.open{display:flex;}
.pw-modal{background:var(--b2);border:1px solid var(--l2);width:min(400px,100vw);padding:28px;}
.pw-modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:200;color:var(--w);margin-bottom:4px;}
.pw-modal-sub{font-family:'Montserrat',sans-serif;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--g);margin-bottom:24px;}
.pw-field{margin-bottom:16px;}
.pw-field label{display:block;font-family:'Montserrat',sans-serif;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--g);margin-bottom:6px;}
.pw-field input{width:100%;background:var(--b3);border:1px solid var(--l);color:var(--w);padding:12px 14px;font-family:'Cormorant Garamond',serif;font-size:15px;outline:none;transition:border-color .2s;}
.pw-field input:focus{border-color:var(--l2);}
.pw-msg{font-family:'Montserrat',sans-serif;font-size:8px;min-height:14px;margin-bottom:12px;}
.pw-msg.err{color:var(--red-t);}
.pw-msg.ok{color:var(--green-t);}
.tb-add{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--b);background:var(--w);padding:8px 18px;cursor:pointer;border:none;transition:opacity .2s;}
.tb-add:hover{opacity:.8;}

/* ─── VIEWS ─── */
.view{display:none;}
.view.active{display:block;}

/* ─── DASHBOARD ─── */
#v-dashboard{padding:40px 32px;}
.dash-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:200;color:var(--w);margin-bottom:8px;}
.dash-sub{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:40px;}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--l);border:1px solid var(--l);margin-bottom:32px;}
.kpi{background:var(--b);padding:28px 24px;}
.kpi-val{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:200;color:var(--w);line-height:1;margin-bottom:6px;}
.kpi-label{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);}
.kpi-delta{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;color:var(--green-t);margin-top:6px;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--l);}
.dash-card{background:var(--b2);padding:28px;}
.dc-title{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--l);}
.lead-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--l);}
.lead-row:last-child{border-bottom:none;}
.lr-left{}
.lr-name{font-size:15px;color:var(--w);font-weight:300;}
.lr-dest{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);margin-top:3px;}
.lr-right{display:flex;align-items:center;gap:12px;}
.status-pill{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;}
.sp-new{background:var(--blue);color:var(--blue-t);}
.sp-contact{background:var(--yellow);color:var(--yellow-t);}
.sp-offer{background:var(--orange);color:var(--orange-t);}
.sp-nego{background:rgba(168,85,247,0.12);color:#c084fc;}
.sp-won{background:var(--green);color:var(--green-t);}
.sp-lost{background:var(--red);color:var(--red-t);}
.lr-val{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:300;letter-spacing:1px;color:var(--w);}
.comm-bar{margin-top:20px;}
.cb-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--l);}
.cb-row:last-child{border-bottom:none;}
.cb-name{font-size:14px;color:var(--w);}
.cb-num{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:1px;color:var(--g);}
.cb-val{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:200;color:var(--green-t);}
.bar-wrap{margin-top:10px;}
.bar-bg{height:3px;background:var(--l2);width:100%;margin-top:6px;}
.bar-fill{height:3px;background:var(--green-t);}

/* ─── PIPELINE KANBAN ─── */
#v-pipeline{padding:32px;}
.pipeline-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.ph-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:200;color:var(--w);}
.ph-actions{display:flex;gap:12px;}
.filter-btn{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);border:1px solid var(--l);padding:8px 16px;background:none;cursor:pointer;transition:all .2s;}
.filter-btn.active,.filter-btn:hover{color:var(--w);border-color:var(--l2);}
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start;}
.k-col{background:var(--b2);border:1px solid var(--l);}
.k-head{padding:14px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;}
.k-title{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:3px;text-transform:uppercase;}
.k-count{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:300;background:var(--l);padding:2px 8px;color:var(--g);}
.k-col[data-status="new"] .k-title{color:var(--blue-t);}
.k-col[data-status="contacted"] .k-title{color:var(--yellow-t);}
.k-col[data-status="offer"] .k-title{color:var(--orange-t);}
.k-col[data-status="nego"] .k-title{color:#c084fc;}
.k-col[data-status="won"] .k-title{color:var(--green-t);}
.k-col[data-status="lost"] .k-title{color:var(--red-t);}
.k-cards{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px;}
.k-card{background:var(--b3);border:1px solid var(--l);padding:14px;cursor:pointer;transition:border-color .2s;}
.k-card:hover{border-color:var(--l2);}
.kc-name{font-size:14px;color:var(--w);margin-bottom:4px;}
.kc-dest{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);margin-bottom:8px;}
.kc-meta{display:flex;justify-content:space-between;align-items:center;}
.kc-budget{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;color:var(--g);}
.kc-sdr{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:1px;text-transform:uppercase;color:rgba(245,243,239,0.2);}
.kc-date{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;color:rgba(245,243,239,0.2);margin-top:6px;}
.kc-urgent{border-left:2px solid var(--yellow-t);}
.kc-hot{border-left:2px solid var(--green-t);}

/* ─── LEAD DETAIL MODAL ─── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:300;display:none;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--b2);border:1px solid var(--l2);width:min(640px,100vw);max-height:85vh;overflow-y:auto;}
.modal-head{padding:24px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:start;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:200;color:var(--w);}
.modal-close{background:none;border:none;color:var(--g);cursor:pointer;font-size:20px;padding:4px;transition:color .2s;}
.modal-close:hover{color:var(--w);}
.modal-body{padding:24px;}
.modal-section{margin-bottom:24px;}
.ms-title{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--l);}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.mf{display:flex;flex-direction:column;gap:4px;}
.mf-label{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);}
.mf-val{font-size:15px;color:var(--w);}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--l);}
.ma-btn{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:2px;text-transform:uppercase;padding:10px 18px;cursor:pointer;transition:all .2s;border:none;}
.ma-primary{background:var(--w);color:var(--b);}
.ma-ghost{background:none;border:1px solid var(--l2);color:var(--g);}
.ma-ghost:hover{color:var(--w);border-color:var(--w);}
.ma-danger{background:none;border:1px solid rgba(248,113,113,0.3);color:var(--red-t);}
.status-select{background:var(--b3);border:1px solid var(--l2);color:var(--w);padding:10px 14px;font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;outline:none;cursor:pointer;}

/* ─── NOUVEAU LEAD FORM ─── */
.new-lead-panel{position:fixed;right:0;top:0;bottom:0;width:min(480px,100vw);background:var(--b2);border-left:1px solid var(--l2);z-index:200;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;}
.new-lead-panel.open{transform:translateX(0);}
.nlp-head{padding:24px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--b2);z-index:10;}
.nlp-title{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:var(--w);}
.nlp-body{padding:24px;}
.form-group{margin-bottom:20px;}
.form-label{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);display:block;margin-bottom:8px;}
.form-label span{color:var(--red-t);}
.form-input{width:100%;background:var(--b3);border:1px solid var(--l);color:var(--w);padding:12px 14px;font-family:'Cormorant Garamond',serif;font-size:15px;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--l2);}
.form-input::placeholder{color:var(--g);}
.form-select{width:100%;background:var(--b3);border:1px solid var(--l);color:var(--w);padding:12px 14px;font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;outline:none;cursor:pointer;}
.form-select option{background:var(--b2);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-btn{width:100%;background:var(--w);color:var(--b);border:none;padding:16px;font-family:'Montserrat',sans-serif;font-size:9px;font-weight:300;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:opacity .2s;margin-top:8px;}
.form-btn:hover{opacity:.8;}
.form-textarea{width:100%;background:var(--b3);border:1px solid var(--l);color:var(--w);padding:12px 14px;font-family:'Cormorant Garamond',serif;font-size:15px;outline:none;resize:vertical;min-height:80px;transition:border-color .2s;}
.form-textarea:focus{border-color:var(--l2);}

/* ─── COMMISSIONS ─── */
#v-commissions{padding:40px 32px;}
.comm-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:32px;}
.comm-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--l);border:1px solid var(--l);margin-bottom:32px;}
.ck{background:var(--b2);padding:32px 28px;}
.ck-label{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:12px;}
.ck-val{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:200;color:var(--w);line-height:1;}
.ck-sub{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;color:var(--g);margin-top:8px;}
.ck-green{color:var(--green-t);}
.comm-table-wrap{background:var(--b2);border:1px solid var(--l);}
.ct-header{padding:16px 24px;border-bottom:1px solid var(--l);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:16px;}
.ct-th{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);}
.ct-row{padding:16px 24px;border-bottom:1px solid var(--l);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:16px;transition:background .2s;}
.ct-row:hover{background:var(--b3);}
.ct-row:last-child{border-bottom:none;}
.ct-cell{font-size:14px;color:var(--w);}
.ct-cell.green{color:var(--green-t);}
.ct-cell.muted{color:var(--g);font-size:13px;}

/* ─── APPORTEUSES ─── */
#v-apporteuses{padding:40px 32px;}
.ap-header{margin-bottom:40px;}
.ap-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:200;color:var(--w);margin-bottom:8px;}
.ap-sub{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);}
.ap-layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
.ap-form-card{background:var(--b2);border:1px solid var(--l);padding:32px;}
.ap-form-title{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:var(--w);margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--l);}
.ap-list-card{background:var(--b2);border:1px solid var(--l);}
.ap-list-head{padding:20px 24px;border-bottom:1px solid var(--l);}
.ap-list-title{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:var(--w);}
.ap-row{padding:16px 24px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;}
.ap-row:last-child{border-bottom:none;}
.ap-row-left{}
.ap-row-name{font-size:16px;color:var(--w);}
.ap-row-meta{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);margin-top:3px;}
.ap-row-right{text-align:right;}
.ap-row-deals{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:200;color:var(--green-t);}
.ap-row-comm{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);margin-top:2px;}
.success-msg{background:var(--green);border:1px solid rgba(74,222,128,0.2);color:var(--green-t);padding:14px 18px;font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:2px;text-transform:uppercase;display:none;margin-bottom:16px;}

/* SHARED */
.section-divider{height:1px;background:var(--l);margin:24px 0;}

/* ─── BELL & NOTIFS ─── */
.tb-bell{position:relative;background:none;border:none;color:var(--g);cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;transition:color .2s;}
.tb-bell:hover{color:var(--w);}
.tb-bell svg{width:18px;height:18px;}
.tb-bell-badge{position:absolute;top:0;right:-2px;background:#fb923c;color:#0a0a0a;font-family:'Montserrat',sans-serif;font-size:8px;font-weight:400;letter-spacing:0;min-width:14px;height:14px;border-radius:7px;padding:0 4px;display:flex;align-items:center;justify-content:center;}
.tb-bell-badge.zero{display:none;}

.notif-panel{position:fixed;top:56px;right:24px;width:380px;max-height:520px;background:var(--b2);border:1px solid var(--l2);z-index:300;display:none;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.notif-panel.open{display:flex;}
.notif-head{padding:14px 18px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;}
.notif-title{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--w);}
.notif-mark{font-family:'Montserrat',sans-serif;font-size:7px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:var(--g);background:none;border:none;cursor:pointer;}
.notif-mark:hover{color:var(--w);}
.notif-list{flex:1;overflow-y:auto;}
.notif-item{padding:14px 18px;border-bottom:1px solid var(--l);cursor:pointer;transition:background .15s;}
.notif-item:hover{background:var(--b3);}
.notif-item.unread{background:rgba(96,165,250,0.04);border-left:2px solid var(--blue-t);}
.notif-item-head{display:flex;justify-content:space-between;gap:10px;align-items:start;}
.notif-item-title{font-size:13px;color:var(--w);line-height:1.4;}
.notif-item-time{font-family:'Montserrat',sans-serif;font-size:7px;color:var(--g);white-space:nowrap;}
.notif-item-body{font-family:'Montserrat',sans-serif;font-size:9px;color:var(--g);margin-top:4px;line-height:1.5;}
.notif-empty{padding:32px 18px;color:var(--g);font-style:italic;text-align:center;font-size:13px;}

/* ─── PIPELINE — search/filters/zoom ─── */
.ph-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center;}
.ph-search{flex:1;min-width:220px;background:var(--b3);border:1px solid var(--l);color:var(--w);padding:9px 14px;font-family:'Cormorant Garamond',serif;font-size:14px;outline:none;}
.ph-search:focus{border-color:var(--l2);}
.ph-select{background:var(--b3);border:1px solid var(--l);color:var(--w);padding:9px 12px;font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:2px;text-transform:uppercase;outline:none;cursor:pointer;}

/* zoom (1 colonne plein écran avec liste détaillée) */

<script>
// ─── DATA (API / SQLite) — pas de données fictives ───
let leads = [];
let apporteuses = [];
let closers = [];
let notifs = [];
let pipelineState = { search: '', closer: '', sort: 'recent', zoom: null };

const statusLabels = { new: 'Nouveau', contacted: 'Contacté', offer: 'Offre envoyée', nego: 'Négociation', won: 'Gagné', lost: 'Perdu' };
const statusClass = { new: 'sp-new', contacted: 'sp-contact', offer: 'sp-offer', nego: 'sp-nego', won: 'sp-won', lost: 'sp-lost' };

const API_STATUS_OPTIONS = [
  ['qualification', 'Qualification'],
  ['new', 'Nouveau'],
  ['contacted', 'Contacté'],
  ['devis_pending', 'Devis à préparer'],
  ['devis_sent', 'Devis envoyé'],
  ['interested', 'Intéressé'],
  ['call_booked', 'Appel booké'],
  ['offer', 'Offre'],
  ['nego', 'Négociation'],
  ['won', 'Gagné'],
  ['lost', 'Perdu'],
];

function kanbanColumn(apiStatus) {
  const s = apiStatus || 'qualification';
  if (['qualification', 'new', 'devis_pending'].includes(s)) return 'new';
  if (s === 'contacted') return 'contacted';
  if (['devis_sent', 'offer'].includes(s)) return 'offer';
  if (['interested', 'call_booked', 'nego'].includes(s)) return 'nego';
  if (s === 'won') return 'won';
  return 'lost';
}

function normalizeApiLead(l) {
  const ts = (typeof l.created_at === 'number')
    ? l.created_at
    : (l.created_at ? Date.parse(l.created_at) || 0 : 0);
  return {
    id: l.id,
    apiStatus: l.status,
    name: l.client_name || 'Client',
    contact: l.client_contact || '—',
    source: l.canal === 'instagram' ? 'Instagram DM' : 'WhatsApp',
    apporteuse: l.apporteur_name || '',
    dest: l.destination || '—',
    dates: l.dates || '',
    type: l.classe || '',
    budget: '—',
    value: Number(l.value) || 0,
    margin: Number(l.margin) || 0,
    status: kanbanColumn(l.status),
    sdr: l.closer_name || '',
    followup: l.next_followup,
    notes: l.notes || '',
    urgent: !!l.urgent,
    created_at: ts,
  };
}

function fmtFollowup(f) {
  if (f == null || f === '') return '';
  const d = typeof f === 'number' ? new Date(f) : new Date(f);
  if (Number.isNaN(d.getTime())) return String(f);
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function currentUserLabel() {
  const u = window.OlaAuth && window.OlaAuth.user;
  return (u && (u.name || u.email)) || 'Équipe';
}

function normRole(r) {
  const x = String(r || '').toLowerCase();
  if (x === 'closeuse') return 'closer';
  if (x === 'dalsim' || x === 'agent') return 'prospecteur';
  return x;
}
function isAdmin() {
  const u = window.OlaAuth && window.OlaAuth.user;
  return u && normRole(u.role) === 'admin';
}
function isProspecteur() {
  const u = window.OlaAuth && window.OlaAuth.user;
  return u && normRole(u.role) === 'prospecteur';
}
function isCloser() {
  const u = window.OlaAuth && window.OlaAuth.user;
  return u && normRole(u.role) === 'closer';
}

function escapeHtmlCrm(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ─── VIEW SWITCH ───
function switchView(id, el) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tb-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('v-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='dashboard') renderDashboard();
  if(id==='pipeline') renderKanban();
  if(id==='commissions') renderCommissions();
  if(id==='apporteuses') fetchApporteurs().then(() => renderApporteuses());
}

// ─── DASHBOARD ───
function renderDashboard() {
  const won = leads.filter(l=>l.status==='won');
  const active = leads.filter(l=>!['won','lost'].includes(l.status));
  const totalCA = won.reduce((s,l)=>s+l.value,0);
  const me = window.OlaAuth && window.OlaAuth.user && window.OlaAuth.user.email;
  const myWon = me ? won.filter(l => l.sdr === me) : won;
  const totalComm1 = myWon.reduce((s,l)=>s+l.margin*0.10,0);
  const pipeline = active.reduce((s,l)=>s+l.value,0);
  const today = leads.filter(l => {
    if (l.followup == null || l.followup === '') return false;
    const d = new Date(typeof l.followup === 'number' ? l.followup : l.followup);
    if (Number.isNaN(d.getTime())) return false;
    const t = new Date();
    return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
  });

  document.getElementById('v-dashboard-inner').innerHTML = `
  <div style="padding:40px 32px;">
    <div class="dash-title">Bonjour, ${escapeHtmlCrm(currentUserLabel())}</div>
    <div class="dash-sub">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
    <div class="kpis">
      <div class="kpi"><div class="kpi-val">${leads.filter(l=>l.status==='new').length}</div><div class="kpi-label">Nouveaux leads</div><div class="kpi-delta">↑ aujourd'hui</div></div>
      <div class="kpi"><div class="kpi-val">${active.length}</div><div class="kpi-label">Leads actifs</div></div>
      <div class="kpi"><div class="kpi-val">${won.length}</div><div class="kpi-label">Deals gagnés</div><div class="kpi-delta" style="color:var(--green-t)">ce mois</div></div>
      <div class="kpi"><div class="kpi-val">${pipeline.toLocaleString('fr-FR')} €</div><div class="kpi-label">Pipeline total</div></div>
      <div class="kpi"><div class="kpi-val" style="color:var(--green-t)">${Math.round(totalComm1).toLocaleString('fr-FR')} €</div><div class="kpi-label">Mes commissions</div></div>
    </div>
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dc-title">Leads récents</div>
        ${leads.slice(0,5).map(l=>`
        <div class="lead-row" onclick="openLeadModal('${String(l.id).replace(/'/g, "\\'")}')" style="cursor:pointer">
          <div class="lr-left"><div class="lr-name">${l.name}</div><div class="lr-dest">${l.dest} · ${l.dates||'dates à confirmer'}</div></div>
          <div class="lr-right">
            <span class="status-pill ${statusClass[l.status]}">${statusLabels[l.status]}</span>
            <span class="lr-val">${l.value>0?l.value.toLocaleString('fr-FR')+' €':'—'}</span>
          </div>
        </div>`).join('')}
      </div>
      <div class="dash-card">
        <div class="dc-title">Commissions · Ce mois</div>
        <div class="comm-bar">
          ${leads.filter(l=>l.status==='won').map(l=>`
          <div class="cb-row">
            <div><div class="cb-name">${l.name}</div><div class="cb-num">${l.dest}</div></div>
            <div class="cb-val">+${Math.round(l.margin*0.10).toLocaleString('fr-FR')} €</div>
          </div>`).join('')}
          ${leads.filter(l=>l.status==='won').length===0?'<div style="color:var(--g);font-size:14px;padding:20px 0;">Aucun deal closé ce mois.</div>':''}
        </div>
        <div style="border-top:1px solid var(--l);margin-top:16px;padding-top:16px;display:flex;justify-content:space-between;">
          <div class="kpi-label">Total commissions</div>
          <div style="font-family:Montserrat,sans-serif;font-size:14px;font-weight:300;color:var(--green-t)">${Math.round(totalComm1).toLocaleString('fr-FR')} €</div>
        </div>
      </div>
    </div>
    ${today.length>0?`
    <div style="margin-top:24px;background:rgba(250,204,21,0.06);border:1px solid rgba(250,204,21,0.15);padding:20px 24px;">
      <div style="font-family:Montserrat,sans-serif;font-size:7px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--yellow-t);margin-bottom:12px;">⚡ Relances du jour (${today.length})</div>
      ${today.map(l=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(250,204,21,0.08)"><span style="font-size:15px;color:var(--w)">${l.name}</span><span style="font-family:Montserrat,sans-serif;font-size:8px;color:var(--yellow-t)">${l.dest}</span></div>`).join('')}
    </div>`:''}
  </div>`;
}

// ─── KANBAN avec search / classement / zoom catégorie ───
let kanbanFilter = 'all';

function applyPipelineFilters(list) {
  let out = [...list];
  // 1) filtres haut (Tous / Mes / Urgents)
  if (kanbanFilter === 'mine') {
    const me = window.OlaAuth && window.OlaAuth.user && window.OlaAuth.user.email;
    if (me) out = out.filter(l => l.sdr === me);
  } else if (kanbanFilter === 'urgent') {
    out = out.filter(l => l.urgent);
  }
  // 2) recherche
  if (pipelineState.search) {
    const q = pipelineState.search.toLowerCase();
    out = out.filter(l =>
      (l.name||'').toLowerCase().includes(q) ||
      (l.dest||'').toLowerCase().includes(q) ||
      (l.contact||'').toLowerCase().includes(q) ||
      (l.notes||'').toLowerCase().includes(q)
    );
  }
  // 3) filtre closer
  if (pipelineState.closer) {
    out = out.filter(l => l.sdr === pipelineState.closer);
  }
  return out;
}

function sortPipeline(list) {
  const arr = [...list];
  switch (pipelineState.sort) {
    case 'value-desc': arr.sort((a,b)=>(b.value||0)-(a.value||0)); break;
    case 'value-asc':  arr.sort((a,b)=>(a.value||0)-(b.value||0)); break;
    case 'urgent':     arr.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0) || (b.value||0)-(a.value||0)); break;
    case 'name':       arr.sort((a,b)=>(a.name||'').localeCompare(b.name||'')); break;
    case 'recent':
    default:           arr.sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  }
  return arr;
}

function renderKanban(filter) {
  if (filter !== undefined) kanbanFilter = filter;
  const statuses = ['new','contacted','offer','nego','won','lost'];
  const board = document.getElementById('kanban-board');
  const zoomBoard = document.getElementById('zoom-board');
  const zoomBack = document.getElementById('zoom-back');

  // Mode zoom : on n'affiche que la colonne sélectionnée en liste détaillée.
  if (pipelineState.zoom) {
    board.style.display = 'none';
    zoomBoard.style.display = 'block';
    zoomBack.style.display = 'inline-block';
    const s = pipelineState.zoom;
    const filtered = sortPipeline(applyPipelineFilters(leads.filter(l => l.status === s)));
    zoomBoard.innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">

  // Mode kanban classique avec headers cliquables (zoom).
  board.style.display = 'grid';
  zoomBoard.style.display = 'none';
  zoomBack.style.display = 'none';
  board.innerHTML = statuses.map(s=>{
    const filtered = sortPipeline(applyPipelineFilters(leads.filter(l=>l.status===s)));

    <div class="k-col" data-status="${s}">

  }).join('');
}

function filterPipeline(f, el) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));

}

function onPipelineSearch(v) { pipelineState.search = String(v||'').trim(); renderKanban(); }

function onPipelineSort(v) { pipelineState.sort = v; renderKanban(); }
function enterZoom(s) { pipelineState.zoom = s; renderKanban(); }
function exitZoom() { pipelineState.zoom = null; renderKanban(); }

function readApOptions() {
  return [0, 1].map((i) => {
    const card = document.querySelector(`[data-ap-opt="${i}"]`);
    const o = { label: i === 0 ? 'Option 1' : 'Option 2' };
    if (!card) return o;
    card.querySelectorAll('[data-k]').forEach((el) => {
      const v = el.value;
      if (el.type === 'number') o[el.dataset.k] = Number(v) || 0;
      else o[el.dataset.k] = v;
    });
    return o;
  });
}

async function submitAdminPricing(devisId, flags) {
  const options = readApOptions();
  const body = { options, regenerate_pdf: true };
  if (flags.showHotel) {
    const name = document.getElementById('ap-hotel-name')?.value?.trim();
    const total = Number(document.getElementById('ap-hotel-total')?.value) || 0;
    if (!name || total <= 0) return alert('Renseignez l\'hôtel et son tarif.');
    body.hotels = [{ name, total_price: total }];
  }
  if (flags.showDriver) {
    const total = Number(document.getElementById('ap-driver-total')?.value) || 0;
    if (total <= 0) return alert('Renseignez le forfait chauffeur.');
    body.driver = { total_price: total, vehicle: 'Berline premium' };
  }
  const r = await fetch('/api/devis/' + encodeURIComponent(devisId) + '/admin-pricing', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    return alert('Erreur : ' + (t || r.status));
  }
  const data = await r.json();
  showAdminPricingRecap(devisId, data.recap, flags.leadId);
}

async function openLatestPendingDevisForLead(leadId) {
  if (!isAdmin()) return;
  try {
    const r = await fetch('/api/leads/' + encodeURIComponent(leadId) + '/devis', { credentials: 'include' });
    if (!r.ok) throw new Error('http ' + r.status);

    const pending = (d.items || []).find(dv => dv.pricing_status === 'pending_admin' || !Number(dv.prix_vente));

// ─── Créer un nouveau devis depuis la fiche lead ───
async function createAndOpenDevis(leadId) {
  const lead = leads.find(x => String(x.id) === String(leadId));
  const btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Création…'; }
  try {
    const r = await fetch('/api/devis', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lead_id: String(leadId) }),
    });
    if (!r.ok) {
      const t = await r.text().catch(() => '');
      throw new Error(t || r.status);
    }
    const data = await r.json();
    const newId = data.item && data.item.id;
    if (!newId) throw new Error('ID manquant dans la réponse');
    // Passe le lead en "devis à préparer" si pas encore avancé
    if (lead && ['qualification', 'new', 'contacted'].includes(lead.apiStatus)) {
      await fetch('/api/leads/' + encodeURIComponent(leadId), {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'devis_pending' }),
      }).catch(() => {});
      await fetchLeadsFromApi();
    }
    if (isAdmin()) {
      openAdminPricingEditor(newId);
    } else {
      alert('Devis ' + newId + ' créé. Un administrateur doit maintenant saisir les tarifs.');
      closeModal();
      openLeadModal(leadId);
    }
  } catch (e) {
    alert('Impossible de créer le devis : ' + (e.message || e));
    if (btn) { btn.disabled = false; btn.textContent = '+ Préparer un devis'; }
  }
}

function readEditorFields(rootSel) {
  const root = document.querySelector(rootSel);
  if (!root) return {};
  const out = {};
  root.querySelectorAll('[data-k]').forEach((el) => {
    const v = el.value;
    if (v === '' || v == null) return;
    if (el.type === 'number') {
      const n = Number(v);
      if (Number.isFinite(n)) out[el.dataset.k] = n;
    } else {
      out[el.dataset.k] = v;
    }
  });
  return out;
}

async function submitDevisEdit(devisId, leadId) {
  const optionsCards = Array.from(document.querySelectorAll('#ed-options .dev-opt-card'));
  const options = optionsCards.map((c, i) => readEditorFields(`#ed-options [data-opt-idx="${i}"]`)).filter((o) => Object.keys(o).length > 0);
  const hotelCards = Array.from(document.querySelectorAll('#ed-hotels .dev-hotel-card'));
  const hotels = hotelCards.map((c, i) => {
    const o = {};
    c.querySelectorAll('[data-k]').forEach((el) => {
      const v = el.value;
      if (v === '' || v == null) return;
      if (el.type === 'number') {
        const n = Number(v);
        if (Number.isFinite(n)) o[el.dataset.k] = n;
      } else o[el.dataset.k] = v;
    });
    return o;
  }).filter((h) => h.name);

  const driver = {
    pickup: document.getElementById('ed-driver-pickup').value || undefined,
    dropoff: document.getElementById('ed-driver-dropoff').value || undefined,
    vehicle: document.getElementById('ed-driver-vehicle').value || undefined,
    hours: Number(document.getElementById('ed-driver-hours').value) || undefined,
    total_price: Number(document.getElementById('ed-driver-total').value) || undefined,
    notes: document.getElementById('ed-driver-notes').value || undefined,
  };
  const driverHasContent = Object.values(driver).some((v) => v != null && v !== '' && v !== 0);

  const services = (document.getElementById('ed-services').value || '')
    .split('\n').map((s) => s.trim()).filter(Boolean);

  const body = {
    compagnie: document.getElementById('ed-compagnie').value,
    horaire_dep: document.getElementById('ed-horaire_dep').value,
    horaire_arr: document.getElementById('ed-horaire_arr').value,
    ...(document.getElementById('ed-prix_revient') ? { prix_revient: Number(document.getElementById('ed-prix_revient').value) || 0 } : {}),
    prix_vente: Number(document.getElementById('ed-prix_vente').value) || 0,
    ...(document.getElementById('ed-prix_marche') ? { prix_marche: Number(document.getElementById('ed-prix_marche').value) || 0 } : {}),
    services_inclus: services,
    options: options.length ? options : [],
    hotels,
    driver: driverHasContent ? driver : null,
    refresh_validity: document.getElementById('ed-refresh-validity').checked,
    regenerate_pdf: true,
  };

  const r = await fetch('/api/devis/' + encodeURIComponent(devisId), {
    method: 'PATCH',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    return alert('Échec mise à jour: ' + (t || r.status));
  }
  const d = await r.json();
  alert('Devis enregistré.');
  closeModal();
  if (leadId) openLeadModal(leadId);
}

async function renvoyerDevis(devisId, leadId) {
  if (!confirm('Renvoyer ce devis par email au client ?')) return;
  const btn = event && event.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi…'; }
  try {
    const r = await fetch('/api/devis/' + encodeURIComponent(devisId) + '/send-email', {
      method: 'POST', credentials: 'include',
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      alert('Envoi échoué : ' + (data.message || data.error || r.status));
      if (btn) { btn.disabled = false; btn.textContent = 'Renvoyer au client'; }
      return;
    }
    alert('Devis envoyé au client.');
    closeModal();
    if (leadId) openLeadModal(leadId);
  } catch (e) {
    alert('Erreur : ' + (e.message || e));
    if (btn) { btn.disabled = false; btn.textContent = 'Renvoyer au client'; }
  }
}

async function loadLeadSummary(leadId, force) {
  const box = document.getElementById('lead-summary');
  const meta = document.getElementById('lead-summary-meta');
  if (!box) return;
  if (force) box.textContent = 'Régénération…';
  try {
    const r = await fetch('/api/leads/' + encodeURIComponent(leadId) + '/summary' + (force ? '?force=1' : ''), { credentials: 'include' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    // Mini-rendu markdown : • → puce, **gras**.
    const text = String(d.summary || '_(vide)_').trim();
    box.innerHTML = text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^•\s/gm, '· ');
    meta.textContent = d.has_conv
      ? `Source : conversation web · ${d.last_message_at ? 'dernière activité ' + fmtTs(d.last_message_at) : ''}`
      : `Source : actions agent · ${d.last_message_at ? 'dernière activité ' + fmtTs(d.last_message_at) : 'aucune activité'}`;
  } catch (e) {
    box.innerHTML = '<span style="color:var(--red-t)">Impossible de générer le résumé.</span>';
    meta.textContent = '';
  }
}

function fmtTs(ts){
  try {
    const d = new Date(Number(ts)||Date.now());
    return d.toLocaleString('fr-FR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
  } catch { return ''; }
}

async function loadAgentActions(leadId){
  const box = document.getElementById('agent-actions');
  if(!box) return;
  try{
    const r = await fetch('/api/agent/actions?lead_id=' + encodeURIComponent(leadId) + '&limit=30', { credentials:'include' });
    if(!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    const items = (data.items||[]);
    if(items.length===0){
      box.innerHTML = '<span style="color:var(--g2)">Aucune action enregistrée.</span>';
      return;
    }
    box.innerHTML = items.map(a => {
      const st = (a.status==='error') ? `<span style="color:var(--red-t)">error</span>` : `<span style="color:var(--green-t)">ok</span>`;
      const label = (a.action||'action').replace(/_/g,' ');
      return `<div style="padding:10px 0;border-bottom:1px solid var(--l)"><div style="display:flex;justify-content:space-between;gap:12px"><div><span style="color:var(--w)">${label}</span> · ${st}</div><div style="color:var(--g2)">${fmtTs(a.created_at)}</div></div>${a.error?`<div style="margin-top:6px;color:var(--red-t)">${a.error}</div>`:''}</div>`;
    }).join('');
  }catch(e){
    box.innerHTML = '<span style="color:var(--red-t)">Impossible de charger l’historique agent.</span>';
  }
}

async function submitPasswordChange() {
  const current = document.getElementById('pw-current').value;
  const newPw = document.getElementById('pw-new').value;
  const confirm = document.getElementById('pw-confirm').value;
  const msg = document.getElementById('pw-msg');
  msg.className = 'pw-msg';
  if (!current || !newPw || !confirm) { msg.className = 'pw-msg err'; msg.textContent = 'Tous les champs sont obligatoires.'; return; }
  if (newPw.length < 8) { msg.className = 'pw-msg err'; msg.textContent = 'Le nouveau mot de passe doit faire au moins 8 caractères.'; return; }
  if (newPw !== confirm) { msg.className = 'pw-msg err'; msg.textContent = 'Les deux nouveaux mots de passe ne correspondent pas.'; return; }
  try {
    const r = await fetch('/api/auth/me/password', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current_password: current, new_password: newPw }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { msg.className = 'pw-msg err'; msg.textContent = j.error || 'Erreur lors du changement.'; return; }
    msg.className = 'pw-msg ok';
    msg.textContent = 'Mot de passe modifié.';
    setTimeout(closePasswordModal, 1200);
  } catch (e) {
    msg.className = 'pw-msg err';
    msg.textContent = 'Réseau indisponible.';
  }
}

function saveNewLead() {
  const name = document.getElementById('nl-name').value.trim();
  if (!name) return alert('Le nom du client est obligatoire.');
  const fu = document.getElementById('nl-followup').value;
  const next_followup = fu ? new Date(fu + 'T12:00:00').toISOString() : null;
  const u = window.OlaAuth && window.OlaAuth.user;
  const payload = {
    client_name: name,
    client_contact: document.getElementById('nl-contact').value,
    canal: (document.getElementById('nl-source').value || '').toLowerCase().includes('instagram') ? 'instagram' : 'whatsapp',
    destination: document.getElementById('nl-dest').value,
    dates: document.getElementById('nl-dates').value,
    classe: document.getElementById('nl-type').value,
    apporteur_name: isProspecteur() ? u.email : (document.getElementById('nl-apporteur')?.value || null),
    closer_name: isCloser() ? u.email : (document.getElementById('nl-closer')?.value || null),
    next_followup,
    notes: document.getElementById('nl-notes').value,
    value: parseInt(document.getElementById('nl-value').value, 10) || 0,
    status: 'qualification',
    urgent: false,
  };
  fetch('/api/leads', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  }).then(async r => {
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      return alert('Impossible de créer le lead : ' + (body.message || body.error || r.status));
    }
    closeNewLead();
    ['nl-name','nl-contact','nl-dest','nl-dates','nl-notes','nl-value'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('nl-followup').value = '';
    return fetchLeadsFromApi();
  }).catch(() => alert('Réseau indisponible'));
}

            <option>Réseau sportifs professionnels</option>
            <option>Réseau entrepreneurs</option>
            <option>Réseau artistes / entertainment</option>
            <option>Réseau HNWI</option>
            <option>Autre</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Taille estimée du réseau</label>
          <select class="form-select" id="ap-size">
            <option value="">Sélectionner</option>
            <option>< 50 contacts qualifiés</option>
            <option>50 – 200 contacts</option>
            <option>200 – 500 contacts</option>
            <option>500+ contacts</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Taux de commission convenu</label>
          <select class="form-select" id="ap-rate">
            <option value="5">5% sur marge</option>
            <option value="7">7% sur marge</option>
            <option value="5" selected>5% sur marge</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Comment a-t-il entendu parler d'Ola Flight ?</label>
          <input class="form-input" id="ap-ref" placeholder="Recommandation, Instagram, réseau perso…">
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-textarea" id="ap-notes" placeholder="Contexte, spécificités, accords particuliers…"></textarea>
        </div>
        <button class="form-btn" onclick="saveApporteuse()">Enregistrer l'apporteur</button>
      </div>
      <div class="ap-list-card">
        <div class="ap-list-head">
          <div class="ap-list-title">Apporteurs actifs (${apporteuses.length})</div>
        </div>
        ${apporteuses.map(a=>`
        <div class="ap-row">
          <div class="ap-row-left">
            <div class="ap-row-name">${a.name}</div>
            <div class="ap-row-meta">${a.instagram} · ${a.network}</div>
            <div class="ap-row-meta" style="margin-top:4px;color:rgba(245,243,239,0.15)">Code : ${a.code}</div>
          </div>
          <div class="ap-row-right">
            <div class="ap-row-deals">${a.deals} deals</div>
            <div class="ap-row-comm">${a.totalValue.toLocaleString('fr-FR')} € générés</div>
            <div style="font-family:Montserrat,sans-serif;font-size:8px;color:var(--green-t);margin-top:4px">Commission due : ${a.commission.toLocaleString('fr-FR')} €</div>
          </div>
        </div>`).join('')}
        <div style="padding:20px 24px;border-top:1px solid var(--l)">
          <div style="font-family:Montserrat,sans-serif;font-size:7px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:12px">Attribution des ventes</div>
          <p style="font-size:14px;color:var(--g);line-height:1.8">Pour attribuer une vente à un apporteur, indiquer son nom dans le champ <strong style="color:var(--w)">Apporteur</strong> lors de la création du lead. La commission est calculée automatiquement sur la marge nette du deal.</p>
        </div>
      </div>
    </div>
  </div>`;
}

function saveApporteuse() {
  const name = document.getElementById('ap-name').value.trim();
  const insta = document.getElementById('ap-insta').value.trim();
  if (!name || !insta) return alert('Nom et Instagram sont obligatoires.');
  fetch('/api/apporteurs', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nom: name,
      instagram: insta,
      phone: document.getElementById('ap-phone').value || null,
      email: document.getElementById('ap-email').value || null,
      reseau: document.getElementById('ap-network').value || null,
      type_reseau: document.getElementById('ap-nettype').value || null,
      taille_reseau: document.getElementById('ap-size').value || null,
      taux_commission: Number(document.getElementById('ap-rate').value) || 10,
      notes: (document.getElementById('ap-ref').value || '') + (document.getElementById('ap-notes').value ? '\n' + document.getElementById('ap-notes').value : ''),
    }),
  }).then(r => {
    if (!r.ok) return alert('Enregistrement impossible');
    document.getElementById('ap-success').style.display = 'block';
    setTimeout(() => document.getElementById('ap-success').style.display = 'none', 3000);
    ['ap-name','ap-insta','ap-phone','ap-email','ap-network','ap-ref','ap-notes'].forEach(id => document.getElementById(id).value = '');
    return fetchLeadsFromApi();
  }).catch(() => alert('Réseau indisponible'));
}

// ─── API SYNC (leads partagés Agent IA ↔ CRM ↔ Dalsim) ───
async function fetchApporteurs() {
  try {
    const r = await fetch('/api/apporteurs', { credentials: 'include' });
    if (!r.ok) return;
    const data = await r.json();
    const raw = data.items || [];
    apporteuses = raw.map(a => {
      const wonWith = leads.filter(l => l.apiStatus === 'won' && l.apporteuse && a.nom && l.apporteuse.trim() === a.nom.trim());
      const totalValue = wonWith.reduce((s, l) => s + l.value, 0);
      const deals = wonWith.length;
      const rate = Number(a.taux_commission) || 10;
      const commission = wonWith.reduce((s, l) => s + Math.round((l.margin || 0) * (rate / 100)), 0);
      return {
        id: a.id,
        name: a.nom,
        instagram: a.instagram || '',
        phone: a.phone || '',
        network: a.reseau || a.type_reseau || '—',
        deals,
        totalValue,
        commission,
        code: a.code || '',
      };
    });
  } catch (e) {
    console.warn('apporteurs', e);
  }
}

async function fetchLeadsFromApi() {
  try {
    const r = await fetch('/api/leads', { credentials: 'include' });
    if (!r.ok) return;
    const data = await r.json();
    leads = (data.items || []).map(normalizeApiLead);
    await fetchApporteurs();
    if (document.getElementById('v-dashboard').classList.contains('active')) renderDashboard();
    if (document.getElementById('v-pipeline').classList.contains('active')) renderKanban();
    if (document.getElementById('v-commissions').classList.contains('active')) renderCommissions();
    if (document.getElementById('v-apporteuses').classList.contains('active')) renderApporteuses();
  } catch (e) {
    console.warn('API leads indisponible', e);
  }
}

// ─── Closers (sélecteur d'assignation) ───
async function fetchClosers() {
  try {
    const r = await fetch('/api/leads/closers/list', { credentials: 'include' });
    if (!r.ok) return;
    const d = await r.json();
    closers = d.items || [];
    const sel = document.getElementById('ph-closer');
    if (sel) {
      const cur = pipelineState.closer;
      sel.innerHTML = '<option value="">Tous les closers</option>' +
        closers.map(c => `<option value="${escapeHtmlCrm(c.email)}" ${cur === c.email ? 'selected' : ''}>${escapeHtmlCrm(c.name || c.email)}</option>`).join('');
    }
  } catch (e) {
    console.warn('closers list', e);
  }
}

// ─── Notifications (cloche) ───
function fmtRelative(ts) {
  const t = (typeof ts === 'number') ? ts : Date.parse(ts) || 0;
  if (!t) return '';
  const diff = Date.now() - t;
  if (diff < 60000) return 'à l\'instant';
  if (diff < 3600000) return Math.floor(diff/60000) + ' min';
  if (diff < 86400000) return Math.floor(diff/3600000) + ' h';
  return Math.floor(diff/86400000) + ' j';
}

async function fetchNotifs() {
  try {
    const r = await fetch('/api/notifications?limit=30', { credentials: 'include' });
    if (!r.ok) return;
    const d = await r.json();
    notifs = d.items || [];
    renderBell();
    renderNotifPanel();
  } catch (e) { /* silence */ }
}

function renderBell() {
  const badge = document.getElementById('tb-bell-badge');
  if (!badge) return;
  const unread = notifs.filter(n => !n.read).length;
  badge.textContent = unread > 99 ? '99+' : String(unread);
  badge.classList.toggle('zero', unread === 0);
}

function renderNotifPanel() {
  const list = document.getElementById('notif-list');
  if (!list) return;
  if (notifs.length === 0) {
    list.innerHTML = '<div class="notif-empty">Aucune notification.</div>';
    return;
  }
  list.innerHTML = notifs.map(n => `
    <div class="notif-item ${n.read ? '' : 'unread'}" onclick="onNotifClick('${String(n.id).replace(/'/g,"\\\\'")}', ${n.lead_id ? `'${String(n.lead_id).replace(/'/g,"\\\\'")}'` : 'null'}, ${n.devis_id ? `'${String(n.devis_id).replace(/'/g,"\\\\'")}'` : 'null'}, '${String(n.type || '').replace(/'/g,"\\\\'")}')">
      <div class="notif-item-head">
        <div class="notif-item-title">${escapeHtmlCrm(n.title || '')}</div>
        <div class="notif-item-time">${fmtRelative(n.created_at)}</div>
      </div>
      ${n.body ? `<div class="notif-item-body">${escapeHtmlCrm(n.body)}</div>` : ''}
    </div>
  `).join('');
}

function toggleNotifPanel(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  const p = document.getElementById('notif-panel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) fetchNotifs();
}

function onNotifClick(id, leadId, devisId, notifType) {
  fetch('/api/notifications/' + encodeURIComponent(id) + '/read', {
    method: 'PATCH', credentials: 'include',
  }).then(() => fetchNotifs()).catch(() => {});
  document.getElementById('notif-panel').classList.remove('open');
  if (leadId && leadId !== 'null') openLeadModal(leadId);
  else if (notifType === 'devis_prices_needed' && devisId && devisId !== 'null' && isAdmin()) {
    openAdminPricingEditor(devisId);
  }
}

function markAllNotifsRead() {
  fetch('/api/notifications/read-all', { method: 'POST', credentials: 'include' })
    .then(() => fetchNotifs()).catch(() => {});
}

async function openNtfyPushSetup(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  try {
    const r = await fetch('/api/notifications/push/setup', { credentials: 'include' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erreur serveur');
    if (!d.enabled) {
      alert(d.hint_fr || 'Push non configuré sur le serveur (NTFY_TOPIC_SECRET).');
      return;
    }
    const msg = [
      'Notifications push Ola Flight (ntfy)',
      '',
      'Vous recevez uniquement VOS alertes (comme la cloche du CRM), pas celles des autres.',
      '',
      '1) Installez l’app « ntfy » (iOS / Android) ou utilisez le site.',
      '2) Abonnez-vous à votre topic personnel (lien ci-dessous).',
      '3) Autorisez les notifications sur le téléphone.',
      '',
      'Lien d’abonnement :',
      d.subscribe_url,
      '',
      'Ne partagez pas ce lien : il est personnel.',
    ].join('\n');
    if (navigator.clipboard && d.subscribe_url) {
      try { await navigator.clipboard.writeText(d.subscribe_url); } catch {}
    }
    if (confirm(msg + '\n\nOuvrir le lien d’abonnement maintenant ?')) {
      window.open(d.subscribe_url, '_blank', 'noopener');
    }
  } catch (err) {
    alert('Impossible de charger la config push : ' + (err.message || err));
  }
}

// Fermer le panel notifs au clic extérieur
document.addEventListener('click', (e) => {
  const p = document.getElementById('notif-panel');
  const b = document.getElementById('tb-bell');
  if (!p || !p.classList.contains('open')) return;
  if (p.contains(e.target) || b.contains(e.target)) return;
  p.classList.remove('open');
});

function refreshTopUser() {
  const el = document.getElementById('tb-user');
  if (el) el.textContent = currentUserLabel();
  // Cache les éléments réservés aux admins (S02 — isolation par rôle).
  document.querySelectorAll('[data-admin-only]').forEach((node) => {
    node.style.display = isAdmin() ? '' : 'none';
  });
  document.querySelectorAll('[data-admin-closer-only]').forEach((node) => {
    node.style.display = (isAdmin() || isCloser()) ? '' : 'none';
  });
}

function startCrm() {
  refreshTopUser();
  fetchLeadsFromApi().then(() => {
    renderDashboard();
    renderKanban();
  });
  fetchClosers();
  fetchNotifs();
}
if (window.OlaAuth && window.OlaAuth.user) startCrm();
else document.addEventListener('ola:auth', startCrm, { once: true });
setInterval(fetchLeadsFromApi, 20000);
setInterval(fetchNotifs, 15000);
</script>
